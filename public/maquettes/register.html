<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription | ChallengeMe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: stretch;
            background: linear-gradient(135deg, #0f172a,  #0c4a6e);
            background-size: 300% 300%;
            animation: gradientFlow 12s ease infinite;
            overflow-x: hidden;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            filter: blur(40px);
            animation: floatParticle 18s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes floatParticle {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(40px, -30px) scale(1.2); opacity: 0.6; }
        }
        .split-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }
        .image-side {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?ixlib=rb-4.0.3&auto=format&fit=crop&w=1350&q=80') center/cover no-repeat;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 2rem;
        }
        .image-side::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15,23,42,0.3), rgba(12,74,110,0.5));
        }
        .image-text {
            position: relative;
            z-index: 2;
            color: white;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            max-width: 80%;
            text-align: center;
        }
        .image-text h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .image-text p {
            font-size: 1rem;
            opacity: 0.9;
        }
        .form-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .glass-card {
            width: 100%;
            max-width: 550px;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(14px);
            border-radius: 2.5rem;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), 0 0 20px rgba(59, 130, 246, 0.2);
            animation: fadeSlideUp 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .card-header { text-align: center; margin-bottom: 1.8rem; }
        .card-header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #fff, #a5f3fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .card-header p { color: #cbd5e6; }
        .form-group { margin-bottom: 1.2rem; }
        .input-wrapper {
            position: relative;
            transition: transform 0.2s;
        }
        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .input-wrapper input, .input-wrapper select {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1.5rem;
            color: white;
            outline: none;
            transition: all 0.25s;
        }
        .input-wrapper input:focus, .input-wrapper select:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            transform: scale(1.01);
        }
        .alert {
            padding: 0.8rem;
            border-radius: 1rem;
            background: rgba(250, 204, 21, 0.2);
            color: #facc15;
            border-left: 4px solid #facc15;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }
        .btn-register {
            width: 100%;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            border: none;
            padding: 0.9rem;
            border-radius: 2rem;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
        }
        .btn-register:hover { transform: scale(1.02); box-shadow: 0 8px 20px rgba(56, 189, 248, 0.4); }
        .btn-register:active { transform: scale(0.98); }
        .btn-register::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            transform: translate(-50%,-50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn-register:active::after { width: 300px; height: 300px; opacity: 0; }
        .login-link {
            text-align: center;
            margin-top: 1.2rem;
            color: #cbd5e6;
        }
        .login-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
            position: relative;
        }
        .login-link a::after {
            content: '';
            position: absolute;
            bottom: -2px; left: 0;
            width: 0; height: 1px;
            background: #38bdf8;
            transition: width 0.3s;
        }
        .login-link a:hover::after { width: 100%; }
        @media (max-width: 800px) {
            .split-container { flex-direction: column; }
            .image-side { min-height: 200px; align-items: center; justify-content: center; }
            .image-text h2 { font-size: 1.5rem; }
            .form-side { padding: 1rem; }
            .glass-card { max-width: 100%; margin: 1rem; padding: 1.5rem; }
        }
        @media (max-width: 550px) { .glass-card { padding: 1.2rem; } }
    </style>
</head>
<body>
    <div class="particle" style="width: 200px; height: 200px; top: 10%; left: -5%; animation-duration: 25s;"></div>
    <div class="particle" style="width: 350px; height: 350px; bottom: -10%; right: -5%; animation-duration: 30s;"></div>
    <div class="particle" style="width: 150px; height: 150px; top: 40%; right: 15%; animation-duration: 20s;"></div>

    <div class="split-container">
        <div class="image-side">
            <div class="image-text">
                <h2>ChallengeMe</h2>
                <p>Créez votre compte et commencez à apprendre en vous amusant</p>
            </div>
        </div>
        <div class="form-side">
            <div class="glass-card">
                <div class="card-header">
                    <h1>Créez votre compte</h1>
                    <p>Rejoignez l'aventure éducative</p>
                </div>
                <form id="registerForm">
                    <div class="form-group">
                        <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" placeholder="Nom complet" required></div>
                    </div>
                    <div class="form-group">
                        <div class="input-wrapper"><i class="fas fa-envelope"></i><input type="email" placeholder="Email" required></div>
                    </div>
                    <div class="form-group">
                        <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" placeholder="Mot de passe" required></div>
                    </div>
                    <div class="form-group">
                        <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" placeholder="Confirmer mot de passe" required></div>
                    </div>
                    <div class="form-group">
                        <div class="input-wrapper"><i class="fas fa-user-tag"></i>
                            <select id="role" required>
                                <option value="eleve">Élève</option>
                                <option value="enseignant">Enseignant</option>
                                <option value="admin_ecole">Admin d'école</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" id="schoolGroup">
                        <div class="input-wrapper"><i class="fas fa-school"></i>
                            <select required>
                                <option>Lycée Victor Hugo</option>
                                <option>Collège Jean Moulin</option>
                                <option>École Internationale</option>
                            </select>
                        </div>
                    </div>
                    <div id="approvalMessage" class="alert" style="display: none;">
                        <i class="fas fa-info-circle"></i> Votre inscription admin sera validée par un super admin.
                    </div>
                    <button type="submit" class="btn-register"><i class="fas fa-user-plus"></i> S'inscrire</button>
                    <div class="login-link">
                        Déjà un compte ? <a href="login.html">Connectez-vous</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const roleSelect = document.getElementById('role');
        const schoolGroup = document.getElementById('schoolGroup');
        const approvalMsg = document.getElementById('approvalMessage');

        roleSelect.addEventListener('change', function() {
            if (this.value === 'admin_ecole') {
                schoolGroup.style.display = 'none';
                approvalMsg.style.display = 'block';
            } else {
                schoolGroup.style.display = 'block';
                approvalMsg.style.display = 'none';
            }
        });
    </script>
</body>
</html>
