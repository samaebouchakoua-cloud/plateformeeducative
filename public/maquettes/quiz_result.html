<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChallengeMe | Résultat du quiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* (style déjà fourni, aucun changement) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a, #0c4a6e);
            background-size: 300% 300%;
            animation: gradientFlow 12s ease infinite;
            overflow-x: hidden;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .particle {
            position: fixed;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(50px);
            animation: floatParticle 20s infinite alternate ease-in-out;
            z-index: 0;
        }
        @keyframes floatParticle {
            0% { transform: translate(0,0) scale(1); opacity: 0.3; }
            100% { transform: translate(40px,-40px) scale(1.3); opacity: 0.6; }
        }
        .dashboard-layout {
            display: flex;
            position: relative;
            z-index: 2;
            min-height: 100vh;
        }
        .sidebar {
            width: 280px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255,255,255,0.15);
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a5f3fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .sidebar-logo i { font-size: 2rem; color: #38bdf8; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            color: #e2e8f0;
            text-decoration: none;
            transition: 0.2s;
            font-weight: 500;
        }
        .nav-item i { width: 1.8rem; font-size: 1.2rem; }
        .nav-item:hover, .nav-item.active { background: rgba(56,189,248,0.2); color: #38bdf8; }
        .main-wrapper {
            flex: 1;
            padding: 1.5rem 2rem;
            overflow-y: auto;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .page-title {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff, #a5f3fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255,255,255,0.1);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            backdrop-filter: blur(4px);
            color: white;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
        }
        .card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 2rem;
            border: 1px solid rgba(255,255,255,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -12px rgba(0,0,0,0.3);
        }
        .result-icon {
            width: 80px;
            height: 80px;
            background: rgba(34,197,94,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2.5rem;
            color: #4ade80;
        }
        h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: white;
        }
        .score {
            font-size: 2.5rem;
            font-weight: 700;
            color: #38bdf8;
            margin: 1rem 0;
        }
        .points {
            color: #cbd5e6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-weight: 600;
            color: white;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56,189,248,0.4);
        }
        @media (max-width: 768px) {
            .sidebar { width: 80px; padding: 1rem 0.5rem; }
            .sidebar-logo span, .nav-item span { display: none; }
            .sidebar-logo i { margin: 0 auto; }
            .nav-item { justify-content: center; }
            .main-wrapper { padding: 1rem; }
            .card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="particle" style="width:300px;height:300px;top:-100px;left:-100px;"></div>
    <div class="particle" style="width:500px;height:500px;bottom:-200px;right:-200px;"></div>
    <div class="particle" style="width:200px;height:200px;top:40%;right:10%;"></div>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo"><i class="fas fa-bolt"></i><span>ChallengeMe</span></div>
                <div style="margin-top:0.5rem; font-size:0.7rem; color:#94a3b8;">Lycée Victor Hugo</div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard_eleve.html" class="nav-item"><i class="fas fa-home"></i><span>Tableau de bord</span></a>
                <a href="mes_challenges.html" class="nav-item"><i class="fas fa-trophy"></i><span>Mes Challenges</span></a>
                <a href="ma_progression.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Ma Progression</span></a>
                <a href="classement_ecole.html" class="nav-item"><i class="fas fa-school"></i><span>Classement école</span></a>
                <a href="classement.html" class="nav-item"><i class="fas fa-medal"></i><span>Classement global</span></a>
                <a href="mon_profil.html" class="nav-item"><i class="fas fa-user"></i><span>Mon Profil</span></a>
            </nav>
            <div style="margin-top:auto; border-top:1px solid rgba(255,255,255,0.1); padding-top:1rem;">
                <a href="login.html" class="nav-item" style="color:#f87171;"><i class="fas fa-sign-out-alt"></i><span>Déconnexion</span></a>
            </div>
        </aside>

        <main class="main-wrapper">
            <header class="topbar">
                <h1 class="page-title">Résultat</h1>
                <div class="user-profile">
                    <div class="avatar">A</div>
                    <span>Alex M.</span>
                </div>
            </header>

            <div class="card">
                <div class="result-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2>Félicitations !</h2>
                <div class="score">12 / 15</div>
                <div class="points">Vous avez gagné <strong>180 points</strong>.</div>
                <a href="dashboard_eleve.html" class="btn"><i class="fas fa-home"></i> Retour au tableau de bord</a>
            </div>
        </main>
    </div>
</body>
</html>
