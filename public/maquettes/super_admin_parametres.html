<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChallengeMe | Paramètres</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', system-ui, sans-serif;
            background: linear-gradient(135deg,#0f172a, #0c4a6e);
            background-size: 300% 300%;
            animation: gradientFlow 12s ease infinite;
            overflow-x: hidden;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .particle {
            position: fixed;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(50px);
            animation: floatParticle 20s infinite alternate ease-in-out;
            z-index: 0;
        }
        @keyframes floatParticle {
            0% { transform: translate(0,0) scale(1); opacity: 0.3; }
            100% { transform: translate(40px,-40px) scale(1.3); opacity: 0.6; }
        }
        .dashboard-layout { display: flex; position: relative; z-index: 2; min-height: 100vh; }
        .sidebar {
            width: 280px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255,255,255,0.15);
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #a5f3fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .sidebar-logo i { font-size: 2rem; color: #38bdf8; }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            color: #e2e8f0;
            text-decoration: none;
            transition: 0.2s;
            font-weight: 500;
        }
        .nav-item i { width: 1.8rem; font-size: 1.2rem; }
        .nav-item:hover, .nav-item.active { background: rgba(56,189,248,0.2); color: #38bdf8; }
        .main-wrapper { flex: 1; padding: 1.5rem 2rem; }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .page-title {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #fff, #a5f3fc);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255,255,255,0.1);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            backdrop-filter: blur(4px);
            color: white;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
        }
        .card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.15);
            margin-bottom: 2rem;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 30px -12px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 1rem; }
        .checkbox-label { display: flex; align-items: center; gap: 0.5rem; color: #e2e8f0; cursor: pointer; }
        .checkbox-label input { width: 1rem; height: 1rem; accent-color: #38bdf8; }
        .divider { margin: 1.5rem 0; border: none; height: 1px; background: rgba(255,255,255,0.1); }
        .badge { display: inline-block; padding: 0.4rem 0.8rem; border-radius: 2rem; font-size: 0.8rem; font-weight: 500; background: rgba(56,189,248,0.2); color: #38bdf8; margin: 0.2rem; }
        .badge i { margin-left: 0.5rem; cursor: pointer; }
        .form-control { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 1rem; padding: 0.6rem 1rem; color: white; outline: none; }
        .btn { background: rgba(56,189,248,0.2); border: none; padding: 0.6rem 1.2rem; border-radius: 2rem; color: #38bdf8; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(90deg,#2563eb,#38bdf8); color: white; }
        @media (max-width: 768px) { .sidebar { width: 80px; } .sidebar-logo span, .nav-item span { display: none; } .nav-item { justify-content: center; } .main-wrapper { padding: 1rem; } }
         .card h3{color:#617993 }
    </style>
</head>
<body>
    <div class="particle" style="width:300px;height:300px;top:-100px;left:-100px;"></div>
    <div class="particle" style="width:500px;height:500px;bottom:-200px;right:-200px;"></div>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header"><div class="sidebar-logo"><i class="fas fa-bolt"></i><span>ChallengeMe</span></div><div style="font-size:0.7rem;color:#94a3b8;">Super Admin</div></div>
            <nav class="sidebar-nav">
                <a href="super_admin_dashboard.html" class="nav-item"><i class="fas fa-home"></i><span>Dashboard</span></a>
                <a href="super_admin_ecoles.html" class="nav-item"><i class="fas fa-school"></i><span>Écoles</span></a>
                <a href="super_admin_utilisateurs.html" class="nav-item"><i class="fas fa-users"></i><span>Utilisateurs</span></a>
                <a href="super_admin_statistiques.html" class="nav-item"><i class="fas fa-chart-line"></i><span>Statistiques</span></a>
                <a href="super_admin_parametres.html" class="nav-item active"><i class="fas fa-cog"></i><span>Paramètres</span></a>
            </nav>
            <div style="margin-top:auto;border-top:1px solid rgba(255,255,255,0.1);padding-top:1rem;"><a href="login.html" class="nav-item" style="color:#f87171;"><i class="fas fa-sign-out-alt"></i><span>Déconnexion</span></a></div>
        </aside>
        <main class="main-wrapper">
            <header class="topbar"><h1 class="page-title">Paramètres généraux</h1><div class="user-profile"><div class="avatar">SA</div><span>Super Admin</span></div></header>
            <div class="card">
                <h3>Paramètres de la plateforme</h3>
                <div class="form-group"><label class="checkbox-label"><input type="checkbox"> Inscription automatique des admins d'école</label></div>
                <div class="form-group"><label class="checkbox-label"><input type="checkbox"> Notification par email pour les nouvelles écoles</label></div>
                <div class="form-group"><label class="checkbox-label"><input type="checkbox"> Activation des challenges sans validation</label></div>
                <hr class="divider">
                <h3>Matières disponibles</h3>
                <div style="margin-bottom:1rem;">
                    <span class="badge">Mathématiques <i class="fas fa-times"></i></span>
                    <span class="badge">Physique <i class="fas fa-times"></i></span>
                    <span class="badge">Histoire <i class="fas fa-times"></i></span>
                    <span class="badge">Informatique <i class="fas fa-times"></i></span>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <input type="text" class="form-control" placeholder="Nouvelle matière" style="width: 200px;">
                    <button class="btn btn-primary">Ajouter</button>
                </div>
                <hr class="divider">
                <h3>Niveaux scolaires</h3>
                <div style="margin-bottom:1rem;">
                    <span class="badge">Seconde <i class="fas fa-times"></i></span>
                    <span class="badge">Première <i class="fas fa-times"></i></span>
                    <span class="badge">Terminale <i class="fas fa-times"></i></span>
                </div>
                <div style="display: flex; gap: 1rem;">
                    <input type="text" class="form-control" placeholder="Nouveau niveau" style="width: 200px;">
                    <button class="btn btn-primary">Ajouter</button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
