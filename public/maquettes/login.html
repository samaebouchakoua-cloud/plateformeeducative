<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - EduPlateforme</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-layout">
        <!-- Left Banner (Branding) -->
        <div class="auth-left">
            <div class="auth-left-content animate-fade-in">
                <h1>EduPlateforme</h1>
                <p>La nouvelle façon d'apprendre et de se challenger. Rejoignez la compétition éducative dès aujourd'hui.</p>
            </div>
        </div>
        
        <!-- Right Form -->
        <div class="auth-right">
            <div class="auth-card animate-fade-in" style="animation-delay: 0.1s;">
                <div class="auth-card-header">
                    <h2>Bon retour !</h2>
                    <p>Connectez-vous à votre compte</p>
                </div>
                
                <form action="dashboard_eleve.html" method="GET">
                    <div class="form-group">
                        <label class="form-label" for="email">Adresse email ou identifiant</label>
                        <div style="position: relative;">
                            <i class="fas fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--gray-400);"></i>
                            <input type="email" id="email" class="form-control" placeholder="nom@exemple.com" required style="padding-left: 2.5rem;">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="password">Mot de passe</label>
                        <div style="position: relative;">
                            <i class="fas fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--gray-400);"></i>
                            <input type="password" id="password" class="form-control" placeholder="••••••••" required style="padding-left: 2.5rem;">
                        </div>
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember">
                            <span>Se souvenir de moi</span>
                        </label>
                        <a href="#" style="font-weight: 500;">Mot de passe oublié ?</a>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> Se connecter
                    </button>
                    
                    <div style="text-align: center; margin-top: 2rem; color: var(--gray-600); font-size: 0.875rem;">
                        Vous n'avez pas de compte ? 
                        <a href="#" style="font-weight: 600;">S'inscrire maintenant</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
